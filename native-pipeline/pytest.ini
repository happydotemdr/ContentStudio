[pytest]
pythonpath = . ../stitcher ../elevenlabs-tooling
; A bare `python -m pytest` here must NEVER hit a real, billed API. The e2e test's only
; other guard is skipping itself when ELEVENLABS_API_KEY is unset -- an ambient key already
; present in the shell (e.g. set for unrelated reasons) silently defeats that guard, as
; happened during Task 11 validation: a plain `python -m pytest` executed the e2e test for
; real and made one billed ElevenLabs TTS call before this addopts line existed. Opt in
; explicitly with `-m e2e` (or `-m e2e -k <name>`) to run it.
addopts = -m "not e2e"
markers =
    e2e: end-to-end run; needs a real ffmpeg/ffprobe on PATH and real ELEVENLABS_API_KEY / Eleven Music access
    allow_network: this test may make a real outbound request -- justify in the docstring
    allow_subprocess: this test may spawn a real subprocess -- justify in the docstring
