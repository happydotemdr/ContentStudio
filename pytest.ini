; Repo-root suite: the linters (Gate C, Gate D) and skill provenance.
;
; testpaths keeps a bare `pytest` here out of pipeline-app/, which is a separate
; suite with its own rootdir and its own scripts/ package. Collecting it from
; here shadows pipeline-app/scripts/ with this directory's scripts/ and raises
; ModuleNotFoundError on four modules that are not broken -- they pass from their
; own directory. See pipeline-app/pytest.ini.
[pytest]
testpaths = tests
