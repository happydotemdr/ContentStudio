# The 1,034 tests in this repo previously ran only when a human remembered, from
# two different directories, with no event that caused them to run (finding F-60).
#
# Three jobs, all windows-latest (the target platform), all `python -m pytest`:
#   root-suite          -- tests/ : Gate C, Gate D, skill provenance
#   app-suite           -- pipeline-app/tests/ : the control app
#   no-live-credentials -- proves the conftest guard fires with vendor keys set
#
# The weekly schedule exists for finding F-76, but NOT because re-running this
# suite can detect yt-dlp / youtube-transcript-api's JSON-schema drift -- it
# structurally cannot. Both libraries are pinned exactly, every test that
# consumes them is mocked against a frozen copy, and the autouse live-call
# guard raises on any unstubbed network call (no test anywhere carries
# `allow_network`). A weekly rerun of a fully-mocked suite is deterministic:
# it passes or fails identically forever, regardless of what the vendors
# change. A schedule that claims to surface drift but structurally cannot is
# a success signal emitted without checking success -- this programme's own
# recurring defect, reproduced in its own CI.
#
# What the weekly run DOES catch is environment drift: an unpinned transitive
# dependency resolving differently, a `windows-latest` runner-image change, a
# deprecated Actions version. That is real and worth having on its own merits.
#
# The actual F-76 signal -- "has yt-dlp / youtube-transcript-api shipped a
# release we have not re-verified the mocked schema against" -- comes from
# scripts/check_pin_freshness.py, run below as a root-suite step gated to the
# scheduled run only. It queries PyPI for each library's latest release and
# fails when a pin is behind, and it fails closed (never a silent pass) when
# a pin cannot be read at all -- see that module's docstring and
# tests/test_check_pin_freshness.py for why it is a separate, unit-tested
# file rather than a script embedded here: nothing inside this YAML can be
# unit-tested. That step, not the suite rerun, is what closes F-76. It stays
# a step inside root-suite, not a fourth job, and it never runs on the
# push/PR path.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  root-suite:
    name: root-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Assert pipeline-app is not installed
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as md, sys
          names = {d.metadata["Name"] for d in md.distributions()}
          if "pipeline-app" in names:
              sys.exit("pipeline-app must not be installed: an editable install can "
                       "shadow the checkout under test (finding F-63)")
          PY
      - name: Root suite
        run: python -m pytest tests/ -q
      - name: Pin freshness vs PyPI (scheduled run only -- the real F-76 signal)
        if: github.event_name == 'schedule'
        run: python -m scripts.check_pin_freshness

  app-suite:
    name: app-suite
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pipeline-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Assert pipeline-app is not installed
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as md, sys
          names = {d.metadata["Name"] for d in md.distributions()}
          if "pipeline-app" in names:
              sys.exit("pipeline-app must not be installed: an editable install can "
                       "shadow the checkout under test (finding F-63)")
          PY
      - name: App suite
        run: python -m pytest -q

  no-live-credentials:
    name: no-live-credentials
    runs-on: windows-latest
    env:
      # Canary values. The guard must fire with keys PRESENT -- that is the state
      # on the operator's machine, where one forgotten stub spawns a real,
      # per-record-billed Bright Data job and the test still passes (finding F-68).
      BRIGHTDATA_API_KEY: ci-canary-must-never-be-used
      RESEND_API_KEY: ci-canary-must-never-be-used
      YOUTUBE_API_KEY: ci-canary-must-never-be-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install both toolchains
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r pipeline-app/requirements-dev.txt
      # Explicit node IDs, not a `-k` substring filter: a `-k` expression that
      # loses its match (e.g. this test gets renamed) just silently selects
      # fewer tests and the job still exits 0 -- pytest's exit-5-on-zero-match
      # only catches losing ALL matches, never a partial, silent narrowing. A
      # node ID that no longer exists is a collection error instead: this job
      # goes red the moment the guard test it depends on is renamed or
      # removed, rather than quietly certifying nothing.
      - name: Root guard
        run: >
          python -m pytest -q
          tests/test_harness_contract.py::test_guard_blocks_are_identical_in_both_conftests
          tests/test_harness_contract.py::test_guard_fires_even_when_every_vendor_key_is_present
      - name: App guard
        working-directory: pipeline-app
        run: >
          python -m pytest -q
          tests/test_harness_contract.py::test_unstubbed_requests_post_is_blocked
          tests/test_harness_contract.py::test_unstubbed_urlopen_is_blocked
          tests/test_harness_contract.py::test_unstubbed_subprocess_run_is_blocked
          tests/test_harness_contract.py::test_a_stubbed_call_still_wins_over_the_guard
          tests/test_harness_contract.py::test_guard_fires_even_when_every_vendor_key_is_present
