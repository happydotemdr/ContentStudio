; App suite. Run from this directory: `cd pipeline-app && python -m pytest`.
;
; This file's real job is to make pipeline-app its own rootdir. pytest picks
; rootdir by walking UP from the invocation, so without it the repo-root
; pytest.ini would capture this suite and redirect it at the root's tests/ via
; testpaths -- silently running the wrong suite.
[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    allow_network: this test may make a real outbound request (requests/urllib). Justify in the docstring.
    allow_subprocess: this test may spawn a real child process. Justify in the docstring.

; Coverage is diagnostic only -- see the repo-root pytest.ini for why no
; coverage-failure gate exists here (finding F-02).
