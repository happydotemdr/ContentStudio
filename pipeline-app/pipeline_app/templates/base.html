<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ContentStudio Pipeline{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Vendored, not CDN-loaded. A third-party <script> with no integrity hash
       runs with full same-origin authority over an unauthenticated local app
       whose POST routes rewrite skill files, commit to git, spend Anthropic
       credit and start billed Bright Data jobs (D-41) -- and when the CDN is
       unreachable the Browse tree dies with no UI signal at all (D-42).
       Serving it from /static removes both problems and needs no SRI. -->
  <script src="/static/htmx-2.0.0.min.js"></script>
  <script>
    function attachSSEChat(formEl) {
      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        const textarea = formEl.querySelector("textarea[name=message]");
        const message = textarea.value;
        textarea.value = "";
        const transcript = document.querySelector(formEl.dataset.transcriptTarget);
        // Build lines via textContent, not innerHTML -- the payload here (the
        // user's own typed message) is still untrusted-enough text to keep
        // consistent with the assistant lines below, and it keeps this path
        // matching the Jinja-rendered replay path, which autoescapes.
        const appendLine = (label, text) => {
          const line = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = `${label}:`;
          line.appendChild(strong);
          line.appendChild(document.createTextNode(` ${text}`));
          return line;
        };
        transcript.appendChild(appendLine("you", message));

        // Kept visible (and updated in place) for the whole turn -- previously
        // the panel showed nothing at all until the final `result` event,
        // which for a 1-4+ minute turn reads as "did this die?" and is the
        // most likely reason someone reloads mid-turn.
        const statusLine = document.createElement("p");
        statusLine.className = "turn-status";
        statusLine.textContent = "running…";
        transcript.appendChild(statusLine);

        const response = await fetch(formEl.action, {
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: `message=${encodeURIComponent(message)}`,
        });
        if (!response.ok) {
          statusLine.remove();
          const line = document.createElement("p");
          line.textContent = `Error: ${await response.text()}`;
          transcript.appendChild(line);
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        // try/finally so a stream that throws (server restart mid-turn, etc.)
        // instead of ending cleanly still runs the "Turn ended without
        // finishing" fallback below -- without this, an uncaught exception
        // here would leave the status line stuck at "running…" forever.
        try {
          while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});
            const parts = buffer.split("\n\n");
            buffer = parts.pop();
            for (const part of parts) {
              if (!part.startsWith("data: ")) continue;
              const event = JSON.parse(part.slice(6));
              if (event.type === "assistant" && event.message && event.message.content) {
                for (const block of event.message.content) {
                  if (block.type === "text" && block.text && block.text.trim()) {
                    transcript.insertBefore(appendLine("assistant", block.text), statusLine);
                  } else if (block.type === "tool_use") {
                    transcript.insertBefore(appendLine("assistant", `↪ ${block.name}`), statusLine);
                  }
                }
              } else if (event.type === "result" && event.result) {
                // The final assistant text block above is byte-identical to
                // event.result on a real recorded turn -- rendering it again
                // here would show the turn's final answer twice. Only clear
                // the "running…" status; the assistant-text branch already
                // rendered the content.
                statusLine.remove();
              }
            }
          }
        } finally {
          // Stream ended without a `result` event -- the turn was aborted
          // (client disconnect, server restart, an exception in the loop
          // above, etc.). Say so instead of silently leaving "running…" up
          // or silently removing it.
          if (statusLine.isConnected) {
            statusLine.textContent = "Turn ended without finishing — reload the page to check status.";
          }
        }
      });
    }
    // This script is inline in <head>, which executes while the parser is
    // still on <head> — before <body> (and the data-sse-chat form in it)
    // exists in the DOM. Deferring the attach loop to DOMContentLoaded (not
    // just `defer`, which inline scripts ignore) ensures the form exists
    // by the time querySelectorAll runs; otherwise it silently binds to
    // nothing and the form falls back to a native POST that renders the
    // raw `data: {...}` SSE stream as page text.
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("form[data-sse-chat]").forEach(attachSSEChat);

      // htmx does not swap on a non-2xx response and does nothing at all on a
      // network error, so before this every failed hx-get left the previously
      // viewed document on screen -- a click that looks like it did nothing
      // while showing content belonging to a different file (E-13). Offline,
      // the whole tree was inert with no signal (D-42).
      const banner = document.getElementById("htmx-error-banner");
      const showHtmxError = (text, target) => {
        if (banner) {
          banner.textContent = text;
          banner.hidden = false;
        }
        if (target && target.id !== "htmx-error-banner") {
          const p = document.createElement("p");
          p.className = "browse-error";
          p.textContent = text;
          target.replaceChildren(p);
        }
      };
      document.body.addEventListener("htmx:responseError", (e) => {
        const status = e.detail.xhr ? e.detail.xhr.status : "?";
        showHtmxError(
          `Request to ${e.detail.requestConfig.path} failed (HTTP ${status}). ` +
          "Nothing on this page was updated.",
          e.detail.target,
        );
      });
      document.body.addEventListener("htmx:sendError", (e) => {
        showHtmxError(
          `Could not reach the app at ${e.detail.requestConfig.path}. ` +
          "The server may have stopped. Nothing on this page was updated.",
          e.detail.target,
        );
      });
      document.body.addEventListener("htmx:beforeRequest", () => {
        if (banner) { banner.hidden = true; }
      });
    });
  </script>
</head>
<body{% if not nav %} class="app-shell-full"{% endif %}>
  {% include "partials/header.html" %}
  <div id="htmx-error-banner" class="htmx-error-banner" role="alert" hidden></div>
  <div class="app-shell">
    {% if nav %}<aside class="app-sidebar">{% block sidebar %}{% include "partials/sidebar.html" %}{% endblock %}</aside>{% endif %}
    <main class="app-main">{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
